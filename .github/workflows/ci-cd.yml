name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flake8
        run: flake8 --max-line-length=120 --exclude=venv .

      - name: Run pytest
        run: pytest -v

  build:
    name: Build and Smoke Test
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t cloud-cicd-app:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name cloud-cicd-smoke-test \
            -p 5000:5000 \
            cloud-cicd-app:${{ github.sha }}

      - name: Wait for application
        run: sleep 5

      - name: Health check
        run: curl -f http://localhost:5000/health

      - name: Stop smoke test container
        if: always()
        run: docker stop cloud-cicd-smoke-test || true

  deploy:
    name: Deploy to AWS EC2
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ARM64 Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: girish312/cloud-cicd-app:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to EC2 using SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy latest Cloud CI/CD application" \
            --parameters 'commands=[
              "docker pull girish312/cloud-cicd-app:latest",
              "docker stop cloud-cicd-container || true",
              "docker rm cloud-cicd-container || true",
              "docker run -d --name cloud-cicd-container --restart unless-stopped -p 80:5000 girish312/cloud-cicd-app:latest"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          echo "Deployment completed successfully."